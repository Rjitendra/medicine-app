<form [formRoot]="invoiceForm" (ngSubmit)="onSubmit($event)">
  <div class="form-section">
    <h3>Invoice Details</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Invoice Number</label>
        <input
          type="number"
          [formField]="invoiceForm.invoiceNo"
          placeholder="Auto-generated if empty"
        />
        <span class="hint">Leave blank to auto-generate the next invoice number</span>
      </div>
      <div class="form-group">
        <label>Invoice Date</label>
        <input type="date" [formField]="invoiceForm.invoiceDate" />
        <span class="hint">Leave blank to use today's date</span>
      </div>
      <div class="form-group">
        <label>Invoice Type</label>
        <select [formField]="invoiceForm.invoiceType">
          <option value="MEDICINE">Medicine Bill</option>
          <option value="PRESCRIPTION">Prescription</option>
        </select>
      </div>
    </div>
  </div>

  <div class="form-section">
    <h3>Customer Details</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Patient Name</label>
        <input type="text" [formField]="invoiceForm.patientName" />
      </div>
      <div class="form-group">
        <label>Doctor Name</label>
        <input type="text" [formField]="invoiceForm.doctorName" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Address</label>
        <input type="text" [formField]="invoiceForm.address" />
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" [formField]="invoiceForm.phoneNumber" />
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn-submit" [disabled]="!invoiceForm().valid()">
      Save Invoice
    </button>
    <button type="button" (click)="cancel.emit()" class="btn-cancel">Cancel</button>
  </div>
</form>
